spring.application.name=auction-app
server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3309/auction_db
spring.datasource.username=auction_user
spring.datasource.password=auction_password
# Default of 10 leaves no headroom for a burst of concurrent bids on one auction.
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
