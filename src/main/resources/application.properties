spring.application.name=auction-app
server.port=8090

spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3309/auction_db}
spring.datasource.username=${DATASOURCE_USERNAME:auction_user}
spring.datasource.password=${DATASOURCE_PASSWORD:auction_password}
# Default of 10 leaves no headroom for a burst of concurrent bids on one auction.
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# identity_server_app JWKS - see incident_management_system_app for the same convention
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:9000/oauth2/jwks}
